{% extends "core/base.html" %}
{% block title %}Two-factor code{% endblock %}
{% block content %}
<div class="card">
  <h1>Enter your code</h1>
  <p>Open your authenticator app and enter the 6-digit code.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{% url 'accounts:mfa' %}">
    {% csrf_token %}
    <label for="id_code">6-digit code</label>
    <input type="text" id="id_code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required autofocus>
    <button type="submit">Verify</button>
  </form>
</div>
{% endblock %}
