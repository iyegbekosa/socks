{% if field.field.widget.input_type == "checkbox" %}<label>{{ field }} {{ field.label }}</label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% endif %}
{% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
{% for e in field.errors %}<p class="error" role="alert">{{ e }}</p>{% endfor %}
