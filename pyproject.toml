[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "build2learn"
version = "0.1.0"
description = "Multi-tenant school management SaaS"
requires-python = ">=3.12"
dependencies = [
    "Django[argon2]>=5.2,<5.3",
    "djangorestframework>=3.15",
    "django-tenants>=3.7",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "cloudinary>=1.41",
    "django-environ>=0.11",
    "python-json-logger>=3",
    "sentry-sdk>=2",
    "gunicorn>=23",
    "django-otp>=1.5",
    "segno>=1.6",
    "Pillow>=10.4",
    "openpyxl>=3.1",
    "defusedxml>=0.7",  # openpyxl uses it automatically to parse XLSX safely
    "httpx>=0.27",  # Paystack adapter (Task 6)
    "weasyprint>=70",  # report card PDFs; needs Pango (see README)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "factory-boy",
    "ruff",
    "mypy",
    "django-stubs",
    "pgserver",  # embedded PostgreSQL for scripts/dev_postgres.py
    "pypdf",  # report-card PDF text in tests
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
markers = [
    "cloudinary: hits the live Cloudinary API (needs CLOUDINARY_URL)",
    "slow: slow tests (still run in CI; deselect locally with -m \"not slow\")",
    "pdf: renders PDFs with WeasyPrint (needs Pango; run via scripts/with-pango locally)",
    "real_clock: keep comms.notify's real clock (skip the daytime pin in tests/conftest.py)",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["cloudinary.*", "django_tenants.*", "environ.*", "pythonjsonlogger.*", "celery.*", "kombu.*", "rest_framework.*", "factory.*", "django_otp.*", "segno.*", "openpyxl.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
